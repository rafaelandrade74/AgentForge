name: agentforge

services:
  # Postgres do próprio compose. Sobe quando COMPOSE_PROFILES contém "local-db" (padrão do .env.example).
  # Para usar um banco que você já tem: tire "local-db" de COMPOSE_PROFILES e defina DATABASE_URL no .env.
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentforge} -d agentforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.316}
        API_BASE_IMAGE: ${API_BASE_IMAGE:-mcr.microsoft.com/dotnet/sdk:8.0}
    restart: unless-stopped
    environment:
      # DATABASE_URL (banco externo) tem prioridade; vazio = o Postgres do compose
      ConnectionStrings__Default: ${DATABASE_URL:-Host=db;Database=agentforge;Username=${POSTGRES_USER:-agentforge};Password=${POSTGRES_PASSWORD:-agentforge}}
      Auth__AdminUsername: ${ADMIN_USERNAME:-admin}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env (cp .env.example .env)}
      Auth__JwtSecret: ${JWT_SECRET:?defina JWT_SECRET no .env (cp .env.example .env)}
      Orchestrator__MaxConcurrency: ${ORCHESTRATOR_CONCURRENCY:-1}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Git__SshDir: /home/app/.ssh
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Login do Claude Code: pela tela "Agentes" da aplicação (link, sem chave) ou, se preferir, esta chave de API.
      # O login fica no volume claude-config. O backend só repassa o ambiente ao CLI; nunca lê nem guarda credenciais.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - repos:/data/repos
      # chave SSH gerada pela tela "Credenciais Git" (a privada fica aqui, nunca sai do servidor)
      - git-ssh:/home/app/.ssh
      # volume nomeado por padrão; CLAUDE_CONFIG_SOURCE=<pasta do computador> reaproveita um login já existente (ver README)
      - ${CLAUDE_CONFIG_SOURCE:-claude-config}:/home/app/.claude
      - ./prompts:/app/prompts:ro
      - ./examples:/examples:ro
    depends_on:
      db:
        condition: service_healthy
        required: false   # sem o profile local-db o serviço não existe e a API segue com DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"   # permite DATABASE_URL apontar para um Postgres do próprio computador
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # só no loopback do host: para depuração; o acesso normal é pelo front (web)
      - "127.0.0.1:${API_DEBUG_PORT:-8081}:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
  repos:
  claude-config:
  git-ssh:
